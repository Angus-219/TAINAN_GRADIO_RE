<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>目前離線</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
           background:#f5f5ff; color:#1f2937; padding:24px; box-sizing:border-box; }
    .card { max-width:420px; width:100%; text-align:center; background:#fff; border-radius:20px;
            padding:32px 24px; box-shadow:0 10px 30px rgba(79,70,229,.15); }
    img { width:88px; height:88px; }
    h1 { font-size:1.4rem; margin:16px 0 8px; }
    p { color:#6b7280; line-height:1.6; margin:0 0 24px; }
    button { background:#4f46e5; color:#fff; border:0; border-radius:12px; padding:12px 24px;
             font-size:1rem; min-height:44px; cursor:pointer; }
    @media (prefers-color-scheme: dark) {
      body { background:#111827; color:#f3f4f6; } .card { background:#1f2937; } p { color:#9ca3af; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/pwa-assets/icons/icon-192.png" alt="">
    <h1>目前沒有網路連線</h1>
    <p>資料需要連線才能載入。請確認網路後重試。</p>
    <button onclick="location.reload()">重新載入</button>
  </div>
</body>
</html>
